name: Build EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version lesen
        id: ver
        shell: bash
        run: |
          V=$(python tools/make_version_file.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$V existiert bereits - kein neues Release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Neue Version v$V - Release wird erstellt"
          fi

      - name: LibreHardwareMonitorLib (NuGet) bauen
        shell: pwsh
        run: |
          dotnet build lhm/LhmDeps.csproj -c Release -o lhm_out
          Remove-Item lhm_out/LhmDeps.* -ErrorAction SilentlyContinue
          Get-ChildItem lhm_out | Select-Object Name, Length | Format-Table -AutoSize
          if (-not (Test-Path lhm_out/LibreHardwareMonitorLib.dll)) { throw "LibreHardwareMonitorLib.dll fehlt" }

      - name: PawnIO-Setup holen (wird von der exe automatisch installiert)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path drivers | Out-Null
          gh release download --repo namazso/PawnIO.Setup --pattern "*.exe" --dir drivers --clobber
          $exe = Get-ChildItem drivers -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "PawnIO-Setup nicht gefunden" }
          if ($exe.Name -ne "PawnIO_setup.exe") { Move-Item $exe.FullName drivers/PawnIO_setup.exe -Force }
          $sig = Get-AuthenticodeSignature drivers/PawnIO_setup.exe
          Write-Host "PawnIO_setup.exe Signatur: $($sig.Status) $($sig.SignerCertificate.Subject)"

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Selbsttest (Import + LHM laden)
        continue-on-error: true
        shell: pwsh
        run: |
          python -c "import pythonnet, clr_loader, pynvml, pystray, flask, paho.mqtt.client; print('Importe OK')"
          python tools/selftest_lhm.py lhm_out

      - name: exe bauen
        run: pyinstaller --noconfirm --clean System-Monitor-MQTT-MK1.spec

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = "release/System-Monitor-MQTT-MK1"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist/System-Monitor-MQTT-MK1.exe $dir/
          Copy-Item README.md, LICENSE-THIRD-PARTY.txt $dir/
          Compress-Archive -Path "$dir/*" -DestinationPath "release/System-Monitor-MQTT-MK1-v$v-windows.zip" -Force
          # Linux-Paket (Brume 2 / Raspberry Pi): Quellcode + install.sh, ohne Windows-Teile
          $lin = "release/linux/System-Monitor-MQTT-MK1"
          New-Item -ItemType Directory -Force -Path $lin | Out-Null
          Copy-Item -Recurse app, web, assets $lin/
          Copy-Item main.py, install.sh, uninstall.sh, README.md $lin/
          Get-ChildItem $lin -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Compress-Archive -Path "release/linux/System-Monitor-MQTT-MK1" -DestinationPath "release/System-Monitor-MQTT-MK1-v$v-linux.zip" -Force

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: System-Monitor-MQTT-MK1-v${{ steps.ver.outputs.version }}-windows
          path: release/System-Monitor-MQTT-MK1/*

      - name: Release erstellen
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: System-Monitor-MQTT-MK1 v${{ steps.ver.outputs.version }}
          files: |
            release/System-Monitor-MQTT-MK1-v${{ steps.ver.outputs.version }}-windows.zip
            release/System-Monitor-MQTT-MK1-v${{ steps.ver.outputs.version }}-linux.zip
          generate_release_notes: true
